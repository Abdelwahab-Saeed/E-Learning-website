<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Gamer Mood</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
    }

    .dashboard-container {
      display: grid;
      grid-template-columns: 250px auto;
      width: 100%;
      min-height: 100vh;
    }

    .sidebar {
      background: #1e293b;
      padding: 20px;
      color: #f8fafc;
      box-shadow: 4px 0 10px rgba(0, 0, 0, 0.2);
    }

    .sidebar .logo {
      font-size: 24px;
      font-weight: 600;
      color: #3b82f6;
      text-align: center;
      margin-bottom: 40px;
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    .sidebar .user-info {
      text-align: center;
      margin-bottom: 40px;
    }

    .sidebar .user-info img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
      border: 2px solid #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
    }

    .sidebar nav ul {
      list-style: none;
    }

    .sidebar nav ul li {
      margin-bottom: 15px;
    }

    .sidebar nav ul li a {
      text-decoration: none;
      font-size: 16px;
      color: #f8fafc;
      padding: 12px 15px;
      display: block;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .sidebar nav ul li a:hover {
      background: #3b82f6;
      color: #f8fafc;
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
      transform: translateX(5px);
    }

    .main-content {
      padding: 30px;
      background: #0f172a;
      color: #f8fafc;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #3b82f6;
      margin-bottom: 20px;
      padding-bottom: 10px;
    }

    .header h1 {
      font-size: 28px;
      color: #3b82f6;
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(59, 130, 246, 0.2);
      border-color: #3b82f6;
    }

    .card h2 {
      font-size: 22px;
      color: #f8fafc;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 18px;
      font-weight: 500;
      color: #3b82f6;
    }

    .activity {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .activity h2 {
      font-size: 20px;
      color: #3b82f6;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    .activity ul {
      list-style: none;
    }

    .activity ul li {
      padding: 12px;
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
      font-size: 16px;
      color: #f8fafc;
      transition: all 0.3s ease;
    }

    .activity ul li:hover {
      background: rgba(59, 130, 246, 0.1);
      transform: translateX(5px);
    }

    .activity ul li:last-child {
      border-bottom: none;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #1e293b;
      color: #f8fafc;
      margin-top: 20px;
      border-top: 1px solid rgba(59, 130, 246, 0.2);
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2);
      transition: all 0.3s ease;
      margin-top: 20px;
      width: 100%;
    }

    .logout-btn:hover {
      background: #dc2626;
      transform: translateY(-2px);
      box-shadow: 0 6px 8px rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="logo">Admin Panel</div>
     
      <nav>
        <ul>
          <li><a href="admin_dashboard.html" class="active">Dashboard</a></li>
          <li><a href="course.html">Manage Courses</a></li>
          <li><a href="category.html">Manage Categories</a></li>
          <li><a href="adminpanel.html">Registeration</a></li>
          <li><a href="progressPage.html">Student progress</a></li>
          <button id="logout-btn" class="logout-btn">Logout</button>

        </ul>
      </nav>
    </aside>
    <main class="main-content">
      <div class="header">
        <h1>Admin Dashboard</h1>
      
        </div>
      <div class="cards">
        
      </div>
      <div class="activity">
          <h1> Welcome to admin dashboard</h1>
      </div>
    </main>
    
  </div>
  <footer>
    <p>&copy; 2025 All rights reserved.</p>
  </footer>

<script>






  function logout() {

    // Redirect the user to the login page
    window.location.href = 'login.html';
    alert("you are have been loged out as admin");

  }

  document.getElementById('logout-btn').addEventListener('click', logout);
</script>



</body>
</html>
