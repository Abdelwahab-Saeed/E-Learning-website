<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Courses</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
  
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
    }
  
    .dashboard-container {
      display: grid;
      grid-template-columns: 250px auto;
      width: 100%;
      min-height: 100vh;
    }
  
    .sidebar {
      background: #1e293b;
      padding: 20px;
      color: #f8fafc;
      box-shadow: 4px 0 10px rgba(0, 0, 0, 0.2);
    }
  
    .sidebar .logo {
      font-size: 24px;
      font-weight: 600;
      color: #3b82f6;
      text-align: center;
      margin-bottom: 40px;
      text-shadow: 0 0 10px #3b82f680;
    }
  
    .sidebar .user-info {
      text-align: center;
      margin-bottom: 40px;
    }
  
    .sidebar .user-info img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
      border: 2px solid #fff;
    }
  
    .sidebar .user-info h2 {
      font-size: 18px;
      margin-bottom: 5px;
      color: #fff;
    }
  
    .sidebar nav ul {
      list-style: none;
    }
  
    .sidebar nav ul li {
      margin-bottom: 15px;
    }
  
    .sidebar nav ul li a {
      text-decoration: none;
      font-size: 16px;
      color: #f8fafc;
      padding: 12px 15px;
      display: block;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
  
    .sidebar nav ul li a:hover {
      background: #3b82f6;
      color: #f8fafc;
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
      transform: translateX(5px);
    }
  
    .main-content {
      padding: 30px;
      background: #0f172a;
    }
  
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid #3b82f6;
    }
  
    .header h1 {
      color: #3b82f6;
      font-size: 28px;
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }
  
    .activity {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #3b82f680;
      margin-bottom: 20px;
    }
  
    .activity h2 {
      font-size: 20px;
      color: #ff69b4;
      margin-bottom: 10px;
    }
  
    .activity ul {
      list-style: none;
    }
  
    .activity ul li {
      padding: 10px;
      border-bottom: 1px solid #ff69b4;
      font-size: 16px;
      color: #333;
    }
  
    .activity ul li:last-child {
      border-bottom: none;
    }
  
    #container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }
  
    #container form {
      padding: 20px;
      width: 500px;
      background: #fefefe;
      border-radius: 10px;
      border: 1px solid #3b82f6;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    }
  
    #container form label {
      margin-bottom: 5px;
      display: block;
      font-weight: 500;
      color: #0f172a;
    }
  
    #container form input,
    #container form textarea,
    #container form select {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #3b82f6;
      background: #fffaf0;
      color: #0f172a;
    }
  
    #container form textarea {
      resize: vertical;
      height: 100px;
    }
  
    #ContentContainer {
      margin-top: 20px;
    }
  
    #ContentContainer .lessonForm {
      background: #fefefe;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.1);
    }
  
    #ContentContainer .lessonForm label {
      font-size: 14px;
      color: #0f172a;
    }
  
    .lessonForm button {
      background-color: #3b82f6;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
  
    .lessonForm button:hover {
      background-color: #2563eb;
    }
  
    #mainBtn,
    #addCourse,
    #addLessonBtn,
    #updateBtn {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      transition: background 0.3s ease;
    }
  
    #mainBtn {
      background-color: #3b82f6;
      color: #fff;
      font-size: 18px;
      height: 40px;
      width: 100%;
      margin-top: 10px;
    }
  
    #mainBtn:hover {
      background-color: #2563eb;
    }
  
    #addCourse {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 90%;
      height: 100px;
      font-size: x-large;
      margin-top: 10px;
      background-color: #3b82f6;
      color: #fff;
    }
  
    #addCourse:hover {
      background-color: #2563eb;
    }
  
    #addCourse:active {
      background-color: #1e40af;
      color: #e0e7ff;
      transform: scale(0.95);
    }
  
    #coursesContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 500px;
      background-color: #fefefe;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    }
  
    #allCourses {
      width: 100%;
      background-color: #fff;
      padding: 10px;
      border-radius: 10px;
      margin-top: 15px;
    }
  
    #delBtn {
      width: 50px;
      background-color: #3b82f6;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
  
    #delBtn:hover {
      background-color: #2563eb;
    }
  
    #updateBtn {
      display: none;
      justify-content: center;
      align-items: center;
      background-color: #3b82f6;
      color: #fff;
      font-size: x-large;
      height: 40px;
      width: 100%;
      border-radius: 20px;
      cursor: pointer;
    }
  
    .course-card {
      border-radius: 10px;
      background-color: #fff;
      padding: 10px;
      margin: 10px 0;
      display: flex;
      gap: 10px;
      border: 1px solid #3b82f680;
    }
  
    footer {
      text-align: center;
      padding: 15px;
      background: #1e293b;
      color: #f8fafc;
      margin-top: 20px;
      border-top: 1px solid rgba(59, 130, 246, 0.2);
    }
  </style>
  </head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="logo">Admin Panel</div>
      <nav>
        <ul>
          <li><a href="admin_dashboard.html" class="active">Dashboard</a></li>
          <li><a href="course.html">Manage Courses</a></li>
          <li><a href="category.html">Manage Categories</a></li>
          <li><a href="adminpanel.html">Registeration</a></li>
          <li><a href="progressPage.html">Student progress</a></li>
        </ul>
      </nav>
    </aside>
    <main class="main-content">
      <div class="header">
        <h1>Course CRUD</h1>
      </div>
      <div id="container">

        <form id="courseForm">

            <h1 id="operation">ADD Course</h1>
            
            <label for="courseTitle">Title:</label>
            <input type="text" id="courseTitle" name="courseTitle"  ><br><br>
            
            <!--maintainance-->
            <label for="image">Foreground Image Link:</label>
            <input type="text" id="image" name="image" ><br><br>

            <!--maintainance-->
            <label for="bgImage">Background Image Link:</label>
            <input type="text" id="bgImage" name="bgImage" ><br><br>
            
            <label for="category">Category:</label>
            <select name="category" id="category" ><option value="">Select a category</option>
            </select><br><br>
            
            <label for="instructor">Instructor Name:</label>
            <input type="text" id="instructor" name="instructor" ><br><br>
            
            <label for="description">Description:</label><br>
            <textarea id="description" name="description" rows="4" cols="50" ></textarea><br><br>
            
            <label for="accessType">Category:</label>
            <select name="accessType" id="accessType">
                <option value="free">Free</option>
                <option value="paid">Paid</option>
            </select><br><br>

            <label for="price">Price: </label>
            <input type="number" id="price" name="price" disabled style="background-color: rgb(204, 204, 204);;"><br><br>
            
            <label for="duration">Duration:</label>
            <input type="number" id="duration" name="duration"><br><br>


            <!--Content Div-->
            <div id="ContentContainer">

                <div style="display: flex;
                            justify-content: space-between;
                            margin-bottom: 10px;">
                    <h2>Content</h2>
                    <button id="addLessonBtn" type="button">Add Lesson</button>
                </div>


                <fieldset class="lessonForm">

                    <!--title-->
                    <label for="lessonTitle">Title: </label>
                    <input type="text" class="mandatory lessonTitle">

                    <!--video url-->
                    <label for="videoURL">Video URL: </label>
                    <input type="text" class="mandatory videoURL">

                    <!--asset-->
                    <label for="asset">Asset: </label>
                    <input type="file" class="asset">

                    <!--rmBtn-->
                    <button onclick="remove(event)" type="button">Delete</button>

                </fieldset>

            </div>

            
            <input type="submit" value="Submit" id="mainBtn">
            <button id="updateBtn" type="button">UPDATE</button>
        </form>

        <!--retrieve the data here-->
        <div id="coursesContainer">
            <button id="addCourse" onclick="resetForm()">Reset</button>
            <h2 style='text-align: center; color: #eee; margin-top: 20px'>Stored Courses</h2>
            <div id="allCourses"></div>
        </div>

    </div>


    <div id="courseList"></div>
    </main>
  </div>
  <footer>
    <p>&copy; 2025 All rights reserved.</p>
  </footer>
  <script type="module" src="./JS/crudCourse.js"></script>
  <script src="./JS/H_crudCourse/addContent.js"></script>
</body>
</html>
