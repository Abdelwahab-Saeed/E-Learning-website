<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
    }

    .dashboard-container {
      display: grid;
      grid-template-columns: 250px auto;
      width: 100%;
      min-height: 100vh;
    }

    .sidebar {
      background: #1e293b;
      padding: 20px;
      color: #f8fafc;
      box-shadow: 4px 0 10px rgba(0, 0, 0, 0.2);
    }

    .sidebar .logo {
      font-size: 24px;
      font-weight: 600;
      color: #3b82f6;
      text-align: center;
      margin-bottom: 40px;
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    .sidebar .user-info {
      text-align: center;
      margin-bottom: 40px;
    }

    .sidebar .user-info img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
      border: 2px solid #ff007a;
    }

    .sidebar .user-info h2 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .sidebar nav ul {
      list-style: none;
    }

    .sidebar nav ul li {
      margin-bottom: 15px;
    }

    .sidebar nav ul li a {
      text-decoration: none;
      font-size: 16px;
      color: #f8fafc;
      padding: 12px 15px;
      display: block;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .sidebar nav ul li a:hover {
      background: #3b82f6;
      color: #f8fafc;
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
      transform: translateX(5px);
    }

    .main-content {
      padding: 30px;
      background: #0f172a;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid #3b82f6;
    }

    .header h1 {
      color: #3b82f6;
      font-size: 28px;
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: #181d2a;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(255, 0, 122, 0.3);
      transition: transform 0.3s ease;
      color: #ffffff;
    }

    .card:hover {
      transform: translateY(-5px);
      background: #a80252;
      color: #0f0f0f;
    }

    .card h2 {
      font-size: 22px;
      color: #ffffff;
    }

    .card p {
      font-size: 18px;
      font-weight: 500;
      color: #e70171;
    }

    .activity {
      background: #181d2a;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(255, 0, 122, 0.3);
    }

    .activity h2 {
      font-size: 20px;
      color: #e70171;
      margin-bottom: 10px;
    }

    .activity ul {
      list-style: none;
    }

    .activity ul li {
      padding: 10px;
      border-bottom: 1px solid #e70171;
      font-size: 16px;
      color: #d6d6d6;
    }

    .activity ul li:last-child {
      border-bottom: none;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    h2 {
      margin-bottom: 3rem;
      text-transform: uppercase;
      font-size: 2rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #f8fafc;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
      background: #0f172a;
      color: #f8fafc;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .btn {
      background: #3b82f6;
      color: #f8fafc;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
    }

    .table-container {
      margin-top: 30px;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
    }

    th {
      background: #0f172a;
      color: #3b82f6;
      font-weight: 600;
    }

    tr:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    .action-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .edit-btn {
      background: #3b82f6;
      color: #f8fafc;
    }

    .edit-btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
    }

    .delete-btn {
      background: #ef4444;
      color: #f8fafc;
    }

    .delete-btn:hover {
      background: #dc2626;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #1e293b;
      color: #f8fafc;
      margin-top: 20px;
      border-top: 1px solid rgba(59, 130, 246, 0.2);
    }
  </style>
</head>

<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="logo">Admin Panel</div>

      <nav>
        <ul>
          <li><a href="admin_dashboard.html" class="active">Dashboard</a></li>
          <li><a href="course.html">Manage Courses</a></li>
          <li><a href="category.html">Manage Categories</a></li>
          <li><a href="adminpanel.html">Registeration</a></li>
          <li><a href="progressPage.html">Student progress</a></li>
        </ul>
      </nav>
    </aside>
    <main class="main-content">
      <div class="header">
        <h1>Courses Registeration</h1>

      </div>

      <div class="container">
        <h2>Pending Enrollments</h2>
        <table>
            <thead>
                <tr>
                    <th>User</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="enrollmentTable">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>
    <script type="module" src="./JS/adminPanel.js"></script>
</body>

</html>
