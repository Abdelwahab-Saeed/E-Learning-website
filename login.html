<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap");
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      html, body {
        height: 100%;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background: url('./images/background.png') no-repeat center center/cover;
        overflow: hidden;
      }

      .background {
        position: absolute;
        width: 100%;
        height: 100%;
        background: url('./images/background.png') no-repeat center center/cover;
        z-index: -1;
      }

      .loginBox {
        background-color: rgba(19, 27, 58, 0.9);
        border: 2px solid #025a75c4;
        border-radius: 15px;
        width: 600px;
        padding: 40px;
        box-shadow: 0 0 30px rgba(0, 153, 255, 0.5);
        /* text-align: center; */
      }

      .loginBox h1 {
        color: #ebf1f3;
        text-align: center;
        margin-bottom: 20px;
        text-shadow: 0 0 10px #00afe4a6;
      }

      .userBox {
        margin: 20px 0;
        position: relative;
      }

      .userBox input {
        width: 100%;
        padding: 14px 50px;
        border: 2px solid #056aade7;
        background: #0a0f29;
        color: white;
        border-radius: 5px;
        outline: none;
        font-size: 16px;
        box-shadow: 0 0 10px rgba(0, 153, 255, 0.5);
      }

      .userBox input:focus {
        border-color: #fcfeff;
        box-shadow: 0 0 20px rgba(0, 195, 255, 0.7);
      }

      .userBox i {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: #edf4f7ef;
        font-size: 20px;
      }

      label[for="email"] {
  font-size: 15px; 
  text-align: right;        
  color: #f1f5f7ea;      
  font-weight: bold;        
  text-transform: uppercase; }

  label[for="password"] {
    padding:1;
  font-size: 15px; 
  text-align: right;        
  color: #f1f5f7ea;      
  font-weight: bold;        
  text-transform: uppercase; }

 
  .remember{
    font-size: 15px; 
  text-align: left;        
  color: #ffffffd5;      
  font-weight: bold;        
  }


      .login-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(to right, #025085, #0066cc);
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        cursor: pointer;
        margin-top: 20px;
        box-shadow: 0 0 15px rgba(1, 122, 202, 0.342);
        transition: 0.3s;
      }

      .login-btn:hover {
        background: linear-gradient(to right, #028fb9, #0377c5);
        box-shadow: 0 0 25px rgb(0, 35, 46);
        transform: scale(1.05);
      }

      .register-text {
        margin-top: 20px;
        font-size: 18px;
        color: #f5f7f8de;
        text-align: center;
      }

      .register-text a {
        color: #00afe4e3;
        text-decoration: none;
        text-align: center;
      }

      .register-text a:hover {
        text-decoration: underline;
      }

      .error {
        color: red;
        font-size: 16px;
      }  
        </style>
  </head>

  <body>
    <div class="loginBox">
      <h1>Login</h1>
      <form id="loginForm">
        <label for="email">Email</label>
        <div class="userBox">
          <input
            type="email"
            id="email"
            required
            placeholder="Enter your email"
          />
          <i class="bx bxs-user"></i>
        </div>
        <div id="emailError" class="error"></div>

        <label for="password">Password</label>
        <div class="userBox">
          <input
            type="password"
            id="password"
            required
            placeholder="Enter your password"
          />
          <i class="bx bxs-lock-alt"></i>
        </div>
        <div id="passwordError" class="error"></div>

        <div class="remember"><input type="checkbox" /> Remember Me</div>

        <div class="login-btn-container">
          <button type="submit" class="login-btn">Login</button>
        </div>

        <div class="register-text">
          <p>Don't have an account? <a href="Register.html">Register</a></p>
        </div>
      </form>
    </div>

    <script type="module" src="./JS/login.js">
      
    </script>
  </body>
</html>
